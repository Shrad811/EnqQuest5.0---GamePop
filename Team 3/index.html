<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chrono Runner</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="game-wrapper">

    <div class="header">

        <div class="logo">
            CHRONO<span>RUNNER</span>
        </div>

        <div class="stats">
            <div>
                TIME
                <strong id="timer">60</strong>
            </div>

            <div>
                SCORE
                <strong id="score">0</strong>
            </div>

            <div>
                LIVES
                <strong id="lives">♥♥♥</strong>
            </div>
        </div>

    </div>


    <div class="game-container">

        <canvas
            id="gameCanvas"
            width="1000"
            height="500">
        </canvas>


        <!-- START -->

        <div id="startScreen" class="screen">

            <div class="title-small">
                AGAINST THE CLOCK
            </div>

            <h1>CHRONO RUNNER</h1>

            <p>
                RUN BEFORE TIME RUNS OUT
            </p>

            <div class="controls">

                <div>
                    <span>SPACE</span>
                    <small>JUMP</small>
                </div>

                <div>
                    <span>↑</span>
                    <small>JUMP</small>
                </div>

            </div>

            <button id="startBtn">
                START RUN
            </button>

        </div>


        <!-- GAME OVER -->

        <div id="gameOverScreen" class="screen hidden">

            <div class="title-small">
                RUN TERMINATED
            </div>

            <h1 id="gameOverTitle">
                TIME'S UP
            </h1>

            <p>
                FINAL SCORE:
                <strong id="finalScore">0</strong>
            </p>

            <button id="restartBtn">
                RUN AGAIN
            </button>

        </div>


        <!-- LEVEL UP -->

        <div id="levelText">
            SPEED UP!
        </div>

    </div>


    <div class="bottom-bar">

        <div>
            💎 <span id="crystals">0</span> TIME CRYSTALS
        </div>

        <div>
            DISTANCE <span id="distance">0</span>m
        </div>

        <div>
            BEST <span id="bestScore">0</span>
        </div>

    </div>

</div>


<script src="index.js"></script>

</body>
</html>
